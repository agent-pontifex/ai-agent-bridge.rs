name: Four-provider roundtable conformance

on:
  pull_request:
    paths:
      - ".github/workflows/four-provider-roundtable.yml"
      - "scripts/four_provider_roundtable.py"
      - "scripts/agent_pontifex_roundtable/**"
      - "tests/fixtures/four-provider-models.json"
      - "tests/test_four_provider_roundtable.py"
      - "docs/four-provider-roundtable.md"
      - "src/live_sessions.rs"
      - "src/live_sessions/**"
      - "src/http.rs"
      - "src/main.rs"
      - "src/types.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: four-provider-roundtable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-bridge-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - name: Verify credential-free adapter contracts
        shell: bash
        run: |
          set -euo pipefail
          for name in OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY XAI_API_KEY; do
            test -z "${!name:-}"
          done
          python3 -m py_compile scripts/four_provider_roundtable.py scripts/agent_pontifex_roundtable/*.py tests/test_four_provider_roundtable.py
          python3 -m unittest tests/test_four_provider_roundtable.py -v
          python3 -m json.tool tests/fixtures/four-provider-models.json >/dev/null

      - name: Build the exact Rust bridge head
        run: cargo build --locked --bin fiducia-ai-agent-bridge

      - name: Exercise four independent SSE subscribers and eight provider turns
        shell: bash
        env:
          BRIDGE_BEARER: agent-pontifex-roundtable-ci-only
        run: |
          set -euo pipefail
          state_dir="${RUNNER_TEMP}/agent-pontifex-roundtable-state"
          mkdir -p "$state_dir" artifacts
          HOST=127.0.0.1 \
          HTTP_PORT=18142 \
          TCP_PORT=0 \
          API_AUTH_BEARER="$BRIDGE_BEARER" \
          AI_AGENT_BRIDGE_DIR="$state_dir" \
          RUST_LOG=info \
          target/debug/fiducia-ai-agent-bridge >artifacts/four-provider-bridge.log 2>&1 &
          bridge_pid=$!
          cleanup() {
            kill "$bridge_pid" 2>/dev/null || true
            wait "$bridge_pid" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          for _ in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:18142/healthz >/dev/null; then
              break
            fi
            if ! kill -0 "$bridge_pid" 2>/dev/null; then
              cat artifacts/four-provider-bridge.log >&2
              exit 1
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:18142/healthz >/dev/null

          python3 scripts/four_provider_roundtable.py \
            --mode mock \
            --bridge-url http://127.0.0.1:18142 \
            --bridge-bearer "$BRIDGE_BEARER" \
            --evidence-out artifacts/four-provider-roundtable.json

      - name: Upload metadata-only evidence and bridge log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: four-provider-roundtable-${{ github.run_id }}
          path: |
            artifacts/four-provider-roundtable.json
            artifacts/four-provider-bridge.log
          if-no-files-found: warn
          retention-days: 14
