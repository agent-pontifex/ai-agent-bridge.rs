name: push validated public persistence code

on:
  push:
    branches:
      - agent/shared-protocol-sdk-foundation
    paths:
      - ".github/workflows/public-persistence-push-code.yml"

permissions:
  contents: read

concurrency:
  group: public-persistence-push-code
  cancel-in-progress: true

jobs:
  push-code:
    if: >-
      github.repository == 'agent-pontifex/ai-agent-bridge.rs' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out reviewed branch without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/shared-protocol-sdk-foundation
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Replay the already-validated public persistence reconciliation
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch vendor/k8s-libs-and-shared-defs
          cat > .gitmodules <<'GITMODULES'
          [submodule "vendor/flags-2-env"]
              path = vendor/flags-2-env
              url = https://github.com/ORESoftware/flags-2-env.git
          GITMODULES

          python3 - <<'PYTHON'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path(
              ".github/workflows/public-persistence-reconcile-v2.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if workflow.count(start_marker) != 1:
              raise SystemExit("reviewed v2 transformation start marker drifted")
          body = workflow.split(start_marker, 1)[1]
          if body.count(end_marker) != 1:
              raise SystemExit("reviewed v2 transformation end marker drifted")
          script = dedent(body.split(end_marker, 1)[0])
          exec(compile(script, "public-persistence-reconcile-v2", "exec"), {})
          PYTHON

          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --check
          test -z "$(git ls-files --stage vendor/k8s-libs-and-shared-defs)"
          ! git diff --cached --name-only | grep -q '^.github/workflows/'
      - name: Push only durable code, schema, and ownership changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: make bridge persistence public'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/shared-protocol-sdk-foundation
