name: DEN-1873 deterministic branch repair

on:
  push:
    branches:
      - feat/den-1873-live-session-compat

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/den-1873-live-session-compat
          fetch-depth: 0

      - name: Restore merged wire compatibility
        shell: bash
        run: |
          cp src/types.rs /tmp/den-1873-types.rs
          git show origin/main:src/types.rs > src/types.rs
          python3 - <<'PY'
          from pathlib import Path

          manifest_path = Path("Cargo.toml")
          manifest = manifest_path.read_text()
          old_dependency = 'hmac = "0.12"'
          if old_dependency not in manifest:
              raise SystemExit("expected hmac 0.12 dependency was not found")
          manifest_path.write_text(manifest.replace(old_dependency, 'hmac = "0.13"', 1))

          types_path = Path("src/types.rs")
          types = types_path.read_text()
          variants = "pub enum AgentKind {\n    Claude,"
          if variants not in types:
              raise SystemExit("AgentKind insertion point was not found")
          types = types.replace(
              variants,
              "pub enum AgentKind {\n    ChatGpt,\n    Claude,",
              1,
          )
          variants = "    Gemini,\n    Kimi,"
          if variants not in types:
              raise SystemExit("Grok insertion point was not found")
          types = types.replace(variants, "    Gemini,\n    Grok,\n    Kimi,", 1)

          branch_types = Path("/tmp/den-1873-types.rs").read_text()
          marker = "#[derive(Clone, Debug, Serialize, Deserialize)]\npub struct WorkflowParticipant"
          marker_index = branch_types.find(marker)
          if marker_index < 0:
              raise SystemExit("workflow wire types were not found")
          types_path.write_text(types.rstrip() + "\n\n" + branch_types[marker_index:].lstrip())

          views_path = Path("src/live_sessions/views.rs")
          views = views_path.read_text()
          old_digest = '    Ok(format!("{:x}", Sha256::digest(bytes)))'
          new_digest = '''    let digest = Sha256::digest(bytes);
              const HEX: &[u8; 16] = b"0123456789abcdef";
              let mut encoded = String::with_capacity(digest.len() * 2);
              for byte in digest {
                  encoded.push(HEX[(byte >> 4) as usize] as char);
                  encoded.push(HEX[(byte & 0x0f) as usize] as char);
              }
              Ok(encoded)'''
          new_digest = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_digest.splitlines()
          )
          if old_digest not in views:
              raise SystemExit("expected event digest formatter was not found")
          views_path.write_text(views.replace(old_digest, new_digest, 1))
          PY

      - name: Regenerate, format, and verify
        shell: bash
        run: |
          cargo fmt --all
          cargo check --all-targets --all-features
          cargo check --locked --all-targets --all-features
          cargo fmt --all -- --check
          git diff --check

      - name: Commit verified repair and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/den-1873-repair.yml
          git add Cargo.toml Cargo.lock src/types.rs src/live_sessions/views.rs
          git commit -m "fix: restore bridge compatibility for DEN-1873"
          git push origin HEAD:feat/den-1873-live-session-compat
