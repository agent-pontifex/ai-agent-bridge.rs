name: DEN-1873 deterministic branch repair

on:
  push:
    branches:
      - feat/den-1873-live-session-compat

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/den-1873-live-session-compat
          fetch-depth: 0

      - name: Apply deterministic compatibility repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest_path = Path('Cargo.toml')
          manifest = manifest_path.read_text()
          old_dependency = 'hmac = "0.12"'
          if old_dependency not in manifest:
              raise SystemExit('expected hmac 0.12 dependency was not found')
          manifest_path.write_text(manifest.replace(old_dependency, 'hmac = "0.13"', 1))

          lock_path = Path('Cargo.lock')
          lock = lock_path.read_text()
          hmac_013 = '''[[package]]
          name = "hmac"
          version = "0.13.0"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "6303bc9732ae41b04cb554b844a762b4115a61bfaa81e3e83050991eeb56863f"
          dependencies = [
           "digest 0.11.3",
          ]
          '''
          hmac_013 = '\n'.join(line[10:] if line.startswith('          ') else line for line in hmac_013.splitlines())
          if 'name = "hmac"\nversion = "0.13.0"' not in lock:
              marker = '[[package]]\nname = "home"'
              if marker not in lock:
                  raise SystemExit('Cargo.lock insertion marker was not found')
              lock = lock.replace(marker, hmac_013.rstrip() + '\n\n' + marker, 1)
          lock_path.write_text(lock)

          Path('src/types.rs').write_text(r'''//! Wire types shared by the HTTP and TCP transports. Everything an agent sends
          //! or receives is one of these serde shapes, so the two transports stay in lockstep.

          use serde::{Deserialize, Serialize};
          use serde_json::Value;

          /// ISO-8601 / RFC-3339 UTC timestamp, e.g. `2026-07-08T12:34:56.789Z`.
          pub type Timestamp = String;

          pub fn now_ts() -> Timestamp {
              chrono::Utc::now().to_rfc3339_opts(chrono::SecondsFormat::Millis, true)
          }

          pub fn new_id() -> String {
              uuid::Uuid::new_v4().to_string()
          }

          #[derive(Clone, Copy, Debug, Default, Serialize, Deserialize, PartialEq, Eq)]
          #[serde(rename_all = "lowercase")]
          pub enum AgentKind {
              ChatGpt,
              Claude,
              Codex,
              Gemini,
              Grok,
              Kimi,
              Qwen,
              Human,
              #[default]
              Other,
          }

          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct Agent {
              pub agent_key: String,
              #[serde(default)]
              pub display_name: String,
              #[serde(default)]
              pub kind: AgentKind,
              #[serde(default, skip_serializing_if = "Option::is_none")]
              pub host: Option<String>,
              #[serde(default)]
              pub meta: Value,
              #[serde(default = "now_ts")]
              pub registered_at: Timestamp,
          }

          /// A time-bounded claim that an agent is working on a repository-relative path.
          /// `recursive` leases cover the named directory and every descendant; ordinary
          /// leases cover exactly one file/path. `fencing_token` changes whenever a new
          /// owner acquires the path, so stale workers cannot renew or release a successor.
          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct FileLease {
              pub id: String,
              pub repository: String,
              pub path: String,
              pub recursive: bool,
              pub agent_key: String,
              #[serde(default)]
              pub purpose: String,
              #[serde(default)]
              pub meta: Value,
              pub fencing_token: u64,
              pub acquired_at: Timestamp,
              pub expires_at: Timestamp,
          }

          /// File ownership lookup result, joining the active lease with the bridge's
          /// registered agent record so callers do not need a second request.
          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct FileLeaseHolder {
              pub lease: FileLease,
              pub agent: Agent,
          }

          #[derive(Clone, Copy, Debug, Default, Serialize, Deserialize, PartialEq, Eq)]
          #[serde(rename_all = "lowercase")]
          pub enum Role {
              #[default]
              User,
              Assistant,
              System,
              Tool,
          }

          #[derive(Clone, Copy, Debug, Default, Serialize, Deserialize, PartialEq, Eq)]
          #[serde(rename_all = "lowercase")]
          pub enum MemberRole {
              Owner,
              #[default]
              Member,
              /// May read the stream but is not counted as an active chatter in presence
              /// (still counts against the 32 cap — a seat is a seat).
              Observer,
          }

          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct Member {
              pub agent_key: String,
              #[serde(default)]
              pub role: MemberRole,
              pub joined_at: Timestamp,
              pub last_seen_at: Timestamp,
          }

          /// A single chat message in a channel. `seq` is a per-channel monotonic counter
          /// (1-based) so clients can page and dedupe deterministically.
          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct Message {
              pub id: String,
              pub channel: String,
              pub seq: u64,
              /// `agent_key` of the sender.
              pub from: String,
              #[serde(default)]
              pub role: Role,
              pub content: String,
              #[serde(default)]
              pub meta: Value,
              pub created_at: Timestamp,
          }

          /// Public view of a channel (embedding vector intentionally omitted).
          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct Channel {
              pub slug: String,
              pub topic: String,
              #[serde(default, skip_serializing_if = "Option::is_none")]
              pub topic_summary: Option<String>,
              pub created_by: String,
              pub created_at: Timestamp,
              pub member_count: usize,
              pub message_count: u64,
              pub embedding_model: String,
              #[serde(default)]
              pub meta: Value,
          }

          /// A channel returned by semantic search, with its cosine score against the query.
          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct ScoredChannel {
              #[serde(flatten)]
              pub channel: Channel,
              pub score: f32,
          }

          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct ContextEntry {
              pub key: String,
              pub value: Value,
              pub version: u32,
              pub updated_by: String,
              pub updated_at: Timestamp,
          }

          #[derive(Clone, Copy, Debug, Serialize, Deserialize, PartialEq, Eq)]
          #[serde(rename_all = "snake_case")]
          pub enum PresenceKind {
              Joined,
              Left,
          }

          /// Everything that fans out to subscribers (SSE + TCP). Tagged so a client can
          /// switch on `type`.
          #[derive(Clone, Debug, Serialize, Deserialize)]
          #[serde(tag = "type", rename_all = "snake_case")]
          pub enum Event {
              Message(Message),
              Presence {
                  channel: String,
                  agent_key: String,
                  event: PresenceKind,
                  member_count: usize,
                  at: Timestamp,
              },
          }

          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct WorkflowParticipant {
              pub agent_key: String,
              pub role: String,
          }

          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct WorkflowArtifact {
              pub artifact_id: String,
              pub name: String,
              pub repository: String,
              pub path: String,
              pub owner_agent_key: String,
              pub summary: String,
              pub expected_content_types: Vec<String>,
          }

          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct WorkflowArtifactSubmission {
              pub artifact_id: String,
              pub name: String,
              pub repository: String,
              pub path: String,
              pub owner_agent_key: String,
              pub summary: String,
              pub content_type: String,
              pub contents: String,
              pub sha256: String,
              pub byte_len: u64,
              pub submitted_at: Timestamp,
          }

          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct WorkflowPlan {
              pub workflow_id: String,
              pub channel: String,
              pub objective: String,
              pub created_by: String,
              pub coordinator_agent_key: Option<String>,
              pub dependency_order: Vec<String>,
              pub participants: Vec<WorkflowParticipant>,
              pub artifacts: Vec<WorkflowArtifact>,
              pub created_at: Timestamp,
          }

          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct WorkflowStatus {
              pub workflow_id: String,
              pub channel: String,
              pub artifact_total: usize,
              pub artifact_submitted: usize,
              pub pending_artifact_ids: Vec<String>,
              pub complete: bool,
          }

          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct WorkflowArtifactResponse {
              pub workflow_id: String,
              pub artifact: WorkflowArtifactSubmission,
              pub replaced: bool,
          }

          #[derive(Clone, Debug, Serialize, Deserialize)]
          pub struct WorkflowArtifactContentResponse {
              pub workflow_id: String,
              pub artifact: WorkflowArtifact,
              pub submission: WorkflowArtifactSubmission,
          }
          '''.replace('\n          ', '\n').lstrip())

          views_path = Path('src/live_sessions/views.rs')
          views = views_path.read_text()
          old_digest = '    Ok(format!("{:x}", Sha256::digest(bytes)))'
          new_digest = '''    let digest = Sha256::digest(bytes);
              const HEX: &[u8; 16] = b"0123456789abcdef";
              let mut encoded = String::with_capacity(digest.len() * 2);
              for byte in digest {
                  encoded.push(HEX[(byte >> 4) as usize] as char);
                  encoded.push(HEX[(byte & 0x0f) as usize] as char);
              }
              Ok(encoded)'''
          new_digest = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_digest.splitlines())
          if old_digest not in views:
              raise SystemExit('expected event digest formatter was not found')
          views_path.write_text(views.replace(old_digest, new_digest, 1))
          PY

      - name: Format and verify the repaired branch
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          git diff --check

      - name: Commit the verified repair and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/den-1873-repair.yml
          git add Cargo.toml Cargo.lock src/types.rs src/live_sessions/views.rs
          git commit -m "fix: restore bridge compatibility for DEN-1873"
          git push origin HEAD:feat/den-1873-live-session-compat
