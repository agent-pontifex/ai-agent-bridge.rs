name: reconcile public persistence consumer v2

on:
  push:
    branches:
      - agent/shared-protocol-sdk-foundation
    paths:
      - ".github/workflows/public-persistence-reconcile-v2.yml"

permissions:
  contents: read

concurrency:
  group: public-persistence-reconcile-v2
  cancel-in-progress: true

jobs:
  reconcile:
    if: >-
      github.repository == 'agent-pontifex/ai-agent-bridge.rs' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: bridge_restart
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge_restart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DPM_INSTALLER_COMMIT: f7180770fc0c7a3dbf9b83dcdc2ac6255da31ffc
      FIDUCIA_BRIDGE_TEST_DATABASE_URL: postgresql://bridge:bridge-test-only@localhost:5432/bridge_restart
      SHADOW_DATABASE_URL: postgresql://bridge:bridge-test-only@localhost:5432/postgres
      EXPECTED_FLAGS_COMMIT: 16fbd8b724e76990e9dcf6237bf44528433b09b1
    steps:
      - name: Check out the reviewed branch without private submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/shared-protocol-sdk-foundation
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Reconcile the consumer with the public contract
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch vendor/k8s-libs-and-shared-defs
          cat > .gitmodules <<'GITMODULES'
          [submodule "vendor/flags-2-env"]
              path = vendor/flags-2-env
              url = https://github.com/ORESoftware/flags-2-env.git
          GITMODULES

          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence of {old!r}; found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "Cargo.toml",
              """# PostgreSQL persistence is optional. The canonical DDL and generated entities
          # are pinned from ORESoftware/k8s-libs-and-shared-defs. This service never runs
          # migrations at boot; DPM diff/verify/apply remains a human-reviewed authority
          # concern in the shared repository.
          """,
              """# PostgreSQL persistence is optional. The bridge-owned public DDL and table
          # identities live under persistence/agent-pontifex-persistence. Service boot
          # never runs migrations; DPM diff/verify/review/apply remains a human boundary.
          """,
          )
          replace_exact(
              "Cargo.toml",
              'dd-pg-defs-sea-orm = { path = "vendor/k8s-libs-and-shared-defs/pg-defs/generated/rust/sea-orm", optional = true }',
              'agent-pontifex-persistence = { path = "persistence/agent-pontifex-persistence", optional = true }',
          )
          replace_exact(
              "Cargo.toml",
              'postgres = ["dep:sea-orm", "dep:dd-pg-defs-sea-orm"]',
              'postgres = ["dep:sea-orm", "dep:agent-pontifex-persistence"]',
          )

          db = Path("src/db.rs")
          text = db.read_text(encoding="utf-8")
          old_docs = """//! hot path (see [`crate::state::AppState`]'s persistence shims). The canonical
          //! DDL is `pg-defs/schema/schema.sql` in the pinned
          //! `ORESoftware/k8s-libs-and-shared-defs` submodule. Generated SeaORM entities
          //! are adapters only; this service never creates or migrates tables at boot.
          """
          new_docs = """//! hot path (see [`crate::state::AppState`]'s persistence shims). The public
          //! desired-state DDL and table identities live in
          //! `persistence/agent-pontifex-persistence`. Immutable upstream provenance is
          //! recorded there, but no private checkout is required. This service never
          //! creates or migrates tables at boot.
          """
          if text.count(old_docs) != 1:
              raise SystemExit("src/db.rs persistence documentation drifted")
          text = text.replace(old_docs, new_docs, 1)
          text = text.replace("dd_pg_defs_sea_orm", "agent_pontifex_persistence")
          text = text.replace("verify_generated_entity_contract", "verify_public_entity_contract")
          text = text.replace(
              "shared_entity_contract_names_the_expected_schema_and_tables",
              "public_entity_contract_names_the_expected_schema_and_tables",
          )
          db.write_text(text, encoding="utf-8")

          restart = Path("tests/postgres_restart.rs")
          text = restart.read_text(encoding="utf-8")
          text = text.replace(
              "canonical pg-defs schema.sql",
              "public Agent Pontifex persistence schema.sql",
          )
          text = text.replace(
              "dedicated canonical-schema database",
              "dedicated public-schema database",
          )
          restart.write_text(text, encoding="utf-8")

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          text = text.replace(
              "# canonical-schema Postgres durability, browser automation, and flags-2-env audits.",
              "# public-schema Postgres durability, browser automation, and flags-2-env audits.",
          )
          text = text.replace(
              "      EXPECTED_SHARED_COMMIT: 3c84cab532b27d328378f09fba5841f02644ae3b\n",
              "",
          )
          text = text.replace("          submodules: recursive\n", "")
          text = text.replace(
              "            ./.github/workflows/seaorm-branch.yml\n",
              "            ./.github/workflows/seaorm-exact.yml\n",
          )
          text = text.replace(
              "      - name: Validate shared schema and SeaORM policy",
              "      - name: Validate public persistence and SeaORM policy",
          )
          text = text.replace(
              "          vendor/k8s-libs-and-shared-defs/pg-defs/scripts/dpm.sh bootstrap \\\n",
              "          dpm bootstrap --source persistence/agent-pontifex-persistence/schema.sql \\\n",
          )
          text = text.replace("canonical-schema.sql", "agent-pontifex-schema.sql")

          lines = text.splitlines(keepends=True)
          index = next(
              (
                  i
                  for i, line in enumerate(lines)
                  if line.strip() == "- run: make -B -C vendor/flags-2-env all"
              ),
              None,
          )
          if index is None:
              raise SystemExit("ci.yml flags2env build step was not found")
          if not any("Initialize the public flags2env source" in line for line in lines):
              indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
              block = [
                  f"{indent}- name: Initialize the public flags2env source\n",
                  f"{indent}  run: |\n",
                  f"{indent}    set -euo pipefail\n",
                  f"{indent}    git submodule sync -- vendor/flags-2-env\n",
                  f"{indent}    git submodule update --init --depth=1 -- vendor/flags-2-env\n",
                  f"{indent}    test \"$(git -C vendor/flags-2-env rev-parse HEAD)\" = \\\n",
                  f"{indent}      \"$EXPECTED_FLAGS_COMMIT\"\n",
              ]
              lines[index:index] = block
          text = "".join(lines)

          dpm_env = (
              "      DPM_INSTALLER_COMMIT: "
              "f7180770fc0c7a3dbf9b83dcdc2ac6255da31ffc\n"
          )
          if text.count(dpm_env) != 1:
              raise SystemExit("ci.yml DPM environment anchor drifted")
          text = text.replace(
              dpm_env,
              dpm_env
              + "      EXPECTED_FLAGS_COMMIT: "
              + "16fbd8b724e76990e9dcf6237bf44528433b09b1\n",
              1,
          )
          ci.write_text(text, encoding="utf-8")

          containers = Path(".github/workflows/container-images.yml")
          text = containers.read_text(encoding="utf-8")
          text = text.replace("          submodules: recursive\n", "")
          anchor = "      - src/**\n"
          if "      - persistence/**\n" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("container workflow source path anchor drifted")
              text = text.replace(anchor, anchor + "      - persistence/**\n", 1)
          containers.write_text(text, encoding="utf-8")

          for workflow in Path(".github/workflows").glob("*.yml"):
              value = workflow.read_text(encoding="utf-8")
              workflow.write_text(
                  value.replace("          submodules: recursive\n", ""),
                  encoding="utf-8",
              )
          PY
      - name: Validate policy and repository ownership
        run: |
          set -euo pipefail
          python3 -m json.tool persistence/agent-pontifex-persistence/contract.json >/dev/null
          node --test scripts/seaorm-policy.test.mjs
          node scripts/check-seaorm-policy.mjs
          test -z "$(git ls-files --stage vendor/k8s-libs-and-shared-defs)"
          ! grep -RIn 'vendor/k8s-libs-and-shared-defs' \
            .gitmodules Cargo.toml .github Dockerfile src tests
          ! grep -RIn 'submodules: recursive' .github/workflows
          git diff --check
      - name: Install the pinned declarative migration tool
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/declarative-migrations/declarative-postgres-migrate.rs/${DPM_INSTALLER_COMMIT}/scripts/install.sh" \
            | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Provision PostgreSQL from the public DPM source
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          dpm bootstrap \
            --source persistence/agent-pontifex-persistence/schema.sql \
            > "${RUNNER_TEMP}/agent-pontifex-schema.sql"
          psql "$FIDUCIA_BRIDGE_TEST_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f "${RUNNER_TEMP}/agent-pontifex-schema.sql"
      - name: Regenerate the renamed path package and validate Rust
        run: |
          set -euo pipefail
          cargo check --all-targets --features postgres
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked --features postgres -- -D warnings
          cargo test --all-targets --locked
          cargo check --all-targets --locked --features postgres
          cargo test --locked --features postgres --test postgres_restart -- --ignored
      - name: Validate the remaining public submodule
        run: |
          set -euo pipefail
          git submodule sync -- vendor/flags-2-env
          git submodule update --init --depth=1 -- vendor/flags-2-env
          test "$(git -C vendor/flags-2-env rev-parse HEAD)" = "$EXPECTED_FLAGS_COMMIT"
          make -B -C vendor/flags-2-env all
          vendor/flags-2-env/build/flags2env audit .cli-flags.toml
      - name: Commit only the durable public result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/public-persistence-reconcile.yml
          rm -f .github/workflows/public-persistence-reconcile-v2.yml
          git add -A
          git diff --cached --check
          test -z "$(git ls-files --stage vendor/k8s-libs-and-shared-defs)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: make bridge persistence public'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/shared-protocol-sdk-foundation
