name: diagnose bridge clippy

on:
  push:
    branches:
      - hardening/workflow-policy-20260930

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: clippy
      - name: Capture exact Clippy diagnostics
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --locked --features postgres -- -D warnings 2>&1 | tee clippy.log
      - name: Extract concise diagnostics
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('clippy.log').read_text(errors='replace').splitlines()
          keep = []
          for i, line in enumerate(lines):
              if line.startswith('error:') or 'error[' in line or '--> ' in line:
                  lo = max(0, i - 2)
                  hi = min(len(lines), i + 8)
                  keep.extend(lines[lo:hi])
                  keep.append('---')
          Path('clippy-errors.txt').write_text('\n'.join(keep) + '\n')
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-clippy-diagnostics-${{ github.sha }}
          path: |
            clippy.log
            clippy-errors.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failure semantics
        if: steps.clippy.outcome != 'success'
        run: exit 1
