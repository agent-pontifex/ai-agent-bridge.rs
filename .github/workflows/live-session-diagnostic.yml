# Diagnostic lane for live-session changes while the canonical locked CI lane
# remains authoritative for merge readiness. This workflow never edits or
# commits the repository lockfile; it resolves in an isolated runner copy so
# formatter/compiler/test failures remain visible when baseline lock drift
# blocks the canonical lane before Cargo reaches the changed code.
name: Live session diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/live-session-diagnostic.yml"
      - "src/live_sessions.rs"
      - "src/live_sessions/**"
      - "src/lib.rs"
      - "src/main.rs"
      - "src/types.rs"
      - "src/workflow_security/**"
      - "docs/live-sessions.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-session-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolved-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: Check formatting at the exact pull-request head
        run: cargo fmt --all -- --check
      - name: Compile and test in an isolated resolved dependency graph
        shell: bash
        run: |
          set -euo pipefail
          resolved="${RUNNER_TEMP}/live-session-resolved"
          mkdir -p "${resolved}"
          tar \
            --exclude=.git \
            --exclude=target \
            -cf - . | tar -xf - -C "${resolved}"
          cd "${resolved}"

          # The canonical CI lane continues to enforce Cargo.lock with --locked.
          # This isolated copy lets Cargo repair pre-existing lock drift only in
          # runner scratch space, so changed Rust code still reaches the compiler.
          cargo metadata --format-version 1 >/dev/null
          cargo clippy --all-targets --features postgres -- -D warnings
          cargo test --all-targets --features postgres
          cargo check --all-targets --features postgres

          if ! cmp -s "${GITHUB_WORKSPACE}/Cargo.lock" Cargo.lock; then
            echo "::warning title=Canonical Cargo.lock drift::The committed lockfile requires a separate reviewed refresh; this diagnostic did not modify the checkout."
            diff -u "${GITHUB_WORKSPACE}/Cargo.lock" Cargo.lock || true
          fi
