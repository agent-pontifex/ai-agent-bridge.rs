name: public persistence contract

on:
  pull_request:
    paths:
      - ".github/workflows/seaorm-exact.yml"
      - ".gitmodules"
      - "Cargo.toml"
      - "Cargo.lock"
      - "persistence/**"
      - "src/db.rs"
      - "tests/postgres_restart.rs"
      - "scripts/check-seaorm-policy.mjs"
      - "scripts/seaorm-policy.mjs"
      - "scripts/seaorm-policy.test.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/seaorm-exact.yml"
      - ".gitmodules"
      - "Cargo.toml"
      - "Cargo.lock"
      - "persistence/**"
      - "src/db.rs"
      - "tests/postgres_restart.rs"
      - "scripts/check-seaorm-policy.mjs"
      - "scripts/seaorm-policy.mjs"
      - "scripts/seaorm-policy.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-persistence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: bridge_restart
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge_restart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DPM_INSTALLER_COMMIT: f7180770fc0c7a3dbf9b83dcdc2ac6255da31ffc
      FIDUCIA_BRIDGE_TEST_DATABASE_URL: postgresql://bridge:bridge-test-only@localhost:5432/bridge_restart
      SHADOW_DATABASE_URL: postgresql://bridge:bridge-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Validate public authority and mutation policy
        run: |
          set -euo pipefail
          node --test scripts/seaorm-policy.test.mjs
          node scripts/check-seaorm-policy.mjs
          ! grep -RIn 'vendor/k8s-libs-and-shared-defs' \
            .gitmodules Cargo.toml .github Dockerfile src tests
      - name: Install the pinned declarative migration tool
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/declarative-migrations/declarative-postgres-migrate.rs/${DPM_INSTALLER_COMMIT}/scripts/install.sh" \
            | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Provision PostgreSQL from the public DPM source
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          dpm bootstrap \
            --source persistence/agent-pontifex-persistence/schema.sql \
            > "${RUNNER_TEMP}/agent-pontifex-schema.sql"
          psql "$FIDUCIA_BRIDGE_TEST_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f "${RUNNER_TEMP}/agent-pontifex-schema.sql"
      - name: Validate SeaORM and restart durability
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked --features postgres -- -D warnings
          cargo test --all-targets --locked
          cargo check --all-targets --locked --features postgres
          cargo test --locked --features postgres --test postgres_restart -- --ignored
          ! grep -RInE \
            '(^|[^A-Za-z0-9_])sqlx::(query|query_as|query_scalar|raw_sql|migrate!)|\bPgPool(Options)?\b|^sqlx[[:space:]]*=' \
            Cargo.toml persistence src tests
