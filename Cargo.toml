# Cargo manifest: crate metadata, dependencies, and the optional `postgres`
# feature for the fiducia-ai-agent-bridge conversation-bus service (binary + lib).

[package]
name = "fiducia-ai-agent-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "A topic-routed, multi-participant conversation bus where AI agents (Claude, Codex, …) chat with each other over TCP (streaming JSONL) and HTTP (REST + SSE). Channels are capped chatrooms found by embedding similarity; state is in-memory with optional Postgres backing."
authors = ["fiducia.cloud"]
license = "MIT"
repository = "https://github.com/fiducia-cloud/fiducia-ai-agent-bridge.rs"
homepage = "https://github.com/fiducia-cloud/fiducia-ai-agent-bridge.rs"
readme = "README.md"
keywords = ["agents", "chat", "embeddings", "tcp", "sse"]
categories = ["network-programming", "web-programming"]

[[bin]]
name = "fiducia-ai-agent-bridge"
path = "src/main.rs"

[[bin]]
name = "fiducia-ai-agent-runner"
path = "src/bin/fiducia-ai-agent-runner.rs"

[[bin]]
name = "fiducia-slack-bridge"
path = "src/bin/fiducia-slack-bridge.rs"

[[bin]]
name = "fiducia-slack-command"
path = "src/bin/fiducia-slack-command.rs"

[lib]
name = "ai_agent_bridge"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tower-http = { version = "0.7", features = ["trace", "catch-panic"] }
# Shared OpenTelemetry + tracing setup (one init() for all services).
fiducia-telemetry = { git = "https://github.com/fiducia-cloud/fiducia-telemetry.rs", tag = "v0.2.1" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
httpdate = "1"
# Slack posts slash commands and interactions as form-encoded bodies.
form_urlencoded = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
# Keep HMAC and SHA-2 on the same digest 0.10 trait family used by the current
# Slack signing implementation; upgrades must move both crates and call sites.
hmac = "0.12"
sha2 = "0.10"
# parking_lot RwLock: no lock poisoning (a panic under the lock can't cascade
# into every later request), and no Result to unwrap.
parking_lot = "0.12"

# PostgreSQL persistence is optional. The bridge-owned public DDL and table
# identities live under persistence/agent-pontifex-persistence. Service boot
# never runs migrations; DPM diff/verify/review/apply remains a human boundary.
sea-orm = { version = "1.1.20", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "postgres-array", "with-uuid", "with-chrono", "with-json"], optional = true }
agent-pontifex-persistence = { path = "persistence/agent-pontifex-persistence", optional = true }

[features]
default = []
postgres = ["dep:sea-orm", "dep:agent-pontifex-persistence"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
